<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c63">
<title>Analyse accident du travail</title>
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface2:#eef3f4; --text:#1b2629; --muted:#5d6d72; --line:#d6dfe1;
  --accent:#0f5c63; --accent-2:#e3f1f2; --accent-text:#ffffff; --warn:#9a5b00; --warn-bg:#fff4e0; --danger:#b42318; --ok:#1f7a3a;
  --c-I:#7b4bb8; --c-T:#1f6fb2; --c-Me:#0f7d6b; --c-Ma:#a35c00; --c-Mi:#6b7a1f; --c-O:#b2324d;
  --l1:#1f7a3a; --l2:#1f6fb2; --l3:#6b4bb8; --l4:#a35c00; --l5:#6d6d6d;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --surface:#1a2225; --surface2:#222c30; --text:#e6eef0; --muted:#9aabb0; --line:#33424700;
    --line:#334247; --accent:#5fb7bf; --accent-2:#1d3438; --accent-text:#0b1d20; --warn:#f0b35a; --warn-bg:#3a2b12; --danger:#ff8a80; --ok:#6fd08c;
    --c-I:#b694e6; --c-T:#7db6ea; --c-Me:#5fd0bd; --c-Ma:#e8a65a; --c-Mi:#b8c76a; --c-O:#ef8aa0;
    --l1:#6fd08c; --l2:#7db6ea; --l3:#b694e6; --l4:#e8a65a; --l5:#b0b0b0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#1a2225; --surface2:#222c30; --text:#e6eef0; --muted:#9aabb0;
  --line:#334247; --accent:#5fb7bf; --accent-2:#1d3438; --accent-text:#0b1d20; --warn:#f0b35a; --warn-bg:#3a2b12; --danger:#ff8a80; --ok:#6fd08c;
  --c-I:#b694e6; --c-T:#7db6ea; --c-Me:#5fd0bd; --c-Ma:#e8a65a; --c-Mi:#b8c76a; --c-O:#ef8aa0;
  --l1:#6fd08c; --l2:#7db6ea; --l3:#b694e6; --l4:#e8a65a; --l5:#b0b0b0; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .title{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer;opacity:.95}
#saveState{font-size:13px;opacity:.85}
#steps{position:sticky;top:48px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
#steps:empty{display:none}
#steps::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface2);font-size:12px}
.pill.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.pill.on .n{background:rgba(255,255,255,.25)}
main{max-width:920px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:6px 0 14px}
h2{font-size:18px;margin:26px 0 10px}
.hero{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero p{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.cards{display:grid;gap:10px}
.dos{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
.dos .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1}
.grid2,.grid3{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}
.fld{display:block;margin:10px 0}
.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.lbl .muted{font-weight:400}
.hint{display:block;color:var(--muted);font-size:13px;margin-top:4px}
input[type=text],input[type=date],input[type=time],input:not([type]),textarea,select{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
select{width:auto;padding:6px 8px;font-size:14px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.opt.on{background:var(--accent-2);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row.small{margin:6px 0}
.row.big .primary{font-size:17px;padding:14px 18px}
button{font:inherit}
.btn,.primary,.ghost{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;font-size:15px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.on{background:var(--accent-2);border-color:var(--accent);font-weight:600}
.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.ghost.danger{color:var(--danger)}
.small{font-size:13px}
.btn.small,.ghost.small{min-height:34px;padding:6px 10px;font-size:14px}
button:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0 4px}
.muted{color:var(--muted)}
.tipbox{background:var(--accent-2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:15px}
.coach{background:var(--warn-bg);color:var(--text);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.warn{color:var(--warn);display:block}
.ok{color:var(--ok);font-weight:600}
.help{margin-top:6px;font-size:14px}
.help summary{cursor:pointer;color:var(--accent)}
.help ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.chips.small .chip{font-size:13px;padding:5px 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left}
.chip.on{background:var(--accent-2);border-color:var(--accent);font-weight:600}
.chip.sg{border-radius:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;padding:9px 12px;background:var(--surface)}
.chip.sg:hover,.chip:hover{border-color:var(--accent)}
.chip .why{margin-left:auto;font-size:12px;color:var(--muted)}
.cat,.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.c-I{background:var(--c-I)}.c-T{background:var(--c-T)}.c-Me{background:var(--c-Me)}.c-Ma{background:var(--c-Ma)}.c-Mi{background:var(--c-Mi)}.c-O{background:var(--c-O)}
.badge.l1{background:var(--l1)}.badge.l2{background:var(--l2)}.badge.l3{background:var(--l3)}.badge.l4{background:var(--l4)}.badge.l5{background:var(--l5)}
:root[data-theme="dark"] .cat,:root[data-theme="dark"] .badge{color:#0b1d20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat,:root:not([data-theme="light"]) .badge{color:#0b1d20}}
.badge.root{background:var(--ok)}
.sugg{background:var(--surface2);border-radius:10px;padding:12px;margin-top:10px}
.card.sugg{border-style:dashed}
.more summary{cursor:pointer;color:var(--accent);font-size:14px;margin:4px 0}
.qs ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.branch.isroot{border-color:var(--ok)}
.whys{list-style:none;margin:8px 0 0;padding:0}
.why{position:relative;padding:0 0 4px 18px;border-left:2px solid var(--line);margin-left:8px}
.why:last-child{border-left-color:transparent}
.why::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.why .q{font-size:14px;color:var(--muted);margin:0 0 4px}
.why .num{font-weight:700;color:var(--accent);margin-right:4px}
.photos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:12px}
.photo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.photo img{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:6px}
.photo input{margin-top:6px}
.sigbox{min-height:90px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;background:#fff;color:#555}
.sigbox img{max-width:100%;max-height:90px}
.sigbox .muted{color:#666}
@media(min-width:720px){.cards:has(.sigc){grid-template-columns:1fr 1fr}}
.sigc{margin:0}
ul.check{margin:6px 0;padding-left:4px;list-style:none}
ul.check li{margin:4px 0}
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#bottom button{flex:0 1 200px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1b2629;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%)}
/* Pavé de signature */
#pad{position:fixed;inset:0;z-index:50;background:#10181a;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
#pad[hidden]{display:none}
.padbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#fff;padding:4px 2px 10px}
.padbar #padTitle{font-weight:600;flex:1;min-width:160px}
.padbar button{background:#ffffff1a;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:8px 12px;min-height:42px;cursor:pointer}
.padbar #padOk{background:#2fb36b;border-color:#2fb36b;font-weight:700}
#padColors{display:flex;gap:6px}
#padColors[hidden]{display:none}
#padColors button{width:38px;padding:0}
#padColors button.on{outline:3px solid #fff}
.padwrap{flex:1;position:relative;background:#fff;border-radius:12px;overflow:hidden;min-height:200px}
#pad:not(.sketch) .padwrap::after{content:"";position:absolute;left:8%;right:8%;bottom:28%;border-bottom:2px solid #c9d3d6;pointer-events:none}
#padCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#padHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#8a979b;font-size:14px;pointer-events:none}
@media print{.top,#steps,#bottom{display:none}}
</style>
</head>
<body>
<header class="top">
  <button id="homeBtn" title="Liste des dossiers">☰ Dossiers</button>
  <div class="title">Analyse d’accident du travail · 5P</div>
  <span id="saveState"></span>
</header>
<nav id="steps"></nav>
<main id="app"></main>
<div id="bottom" hidden><button class="btn" id="prevBtn">← Précédent</button><button class="primary" id="nextBtn">Suivant →</button></div>
<datalist id="delais"><option value="Immédiat"><option value="1 mois"><option value="3 mois"><option value="6 mois"><option value="1 an"></datalist>
<div id="pad" hidden>
  <div class="padbar">
    <span id="padTitle"></span>
    <span id="padColors" hidden><button data-c="#111" style="background:#111" class="on" aria-label="Noir"></button><button data-c="#c62828" style="background:#c62828" aria-label="Rouge"></button><button data-c="#1565c0" style="background:#1565c0" aria-label="Bleu"></button><button data-c="#2e7d32" style="background:#2e7d32" aria-label="Vert"></button></span>
    <button id="padUndo">↶ Annuler trait</button><button id="padClear">Effacer</button><button id="padCancel">Fermer</button><button id="padOk">✓ Valider</button>
  </div>
  <div class="padwrap"><canvas id="padCanvas"></canvas><div id="padHint"></div></div>
</div>
<div id="toast" role="status"></div>

  return `${qui} s’est blessé(e)${les}${quoi}${quand}.`;
}

  else if (!S.branches.some(b => b.root)) miss.push(["Aucune cause racine marquée", 4]);
  if (!S.actions.length) miss.push(["Mesures de prévention à prévoir", 5]);
  const h = contentHash(S); const sigs = allSigs(S);

    <p>${signed} signature(s) sur ${sigs.length} participant(s).</p>
    ${stale.length ? `<p class="warn">⚠ ${stale.length} signature(s) apposée(s) avant la dernière modification du dossier (${stale.map(x => esc(x.s.name || x.label)).join(", ")}).</p>` : ""}
  </div>
  <div class="row big">
    <button class="primary" id="docxBtn">⬇ Télécharger le formulaire Word (.docx)</button>
    ${navigator.canShare ? `<button class="btn" id="shareBtn">↗ Partager le formulaire</button>` : ""}
  </div>
  <h2>Transférer le dossier</h2>
  <p class="muted">Pour continuer sur un autre appareil (par exemple faire signer sur un téléphone) : sauvegardez le dossier, envoyez le fichier, puis importez-le dans cette application sur l’autre appareil.</p>
  <div class="row">
    <button class="btn" id="jsonBtn">💾 Sauvegarder le dossier (.json)</button>
    <label class="btn">📂 Importer un dossier<input type="file" accept=".json,application/json" id="importIn" hidden></label>
  </div>`;
}

    img.onload = () => { const max = 1600; let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, max / Math.max(w, h)); w = Math.round(w * r); h = Math.round(h * r); const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res({ data: c.toDataURL("image/jpeg", 0.8), w, h }); };

  setTok(doc, "{{T:VICTIME}}", D.victime ? " " + D.victime : "");
  setTok(doc, "{{T:DATE_ACC}}", D.dateAcc ? frDate(D.dateAcc) + (D.heureAcc ? " à " + D.heureAcc.replace(":", "h") : "") : "");
  const cb = (tok, on) => tNodes(doc, `{{CB:${tok}}}`).forEach(t => {
    t.textContent = on ? "☒" : "☐";
    const rPr = t.parentNode.getElementsByTagNameNS(NS.w, "rPr")[0]; const f = rPr && rPr.getElementsByTagNameNS(NS.w, "rFonts")[0];
    if (f) ["ascii", "hAnsi", "eastAsia", "cs"].forEach(k => f.setAttributeNS(NS.w, "w:" + k, "MS Gothic"));
  });
  cb("SST_OUI", D.sst === "oui"); cb("SST_NON", D.sst === "non");
  cb("APP15_OUI", D.app15 === "oui"); cb("APP15_NON", D.app15 === "non");
  cb("TR_NON", D.transport === "non"); cb("TR_OUI", D.transport === "oui");
  cb("TR_SAMU", D.transport === "oui" && D.transportMode.includes("samu")); cb("TR_POMP", D.transport === "oui" && D.transportMode.includes("pompiers"));
  ["CDI", "CDD", "TH", "STAG", "EXT"].forEach(k => cb(k, D.contrat.includes(k)));
  setTok(doc, "{{T:ANC}}", D.anciennete);
  setTok(doc, "{{T:LESIONS}}", D.lesions);
  // Blocs texte
  fillBlock("RECIT", textLines(D.recit), 115);
  fillBlock("INDIV", textLines(D.indiv), 70);
  fillBlock("TACHE", textLines(D.tache), 70);
  fillBlock("METH", textLines(D.meth), 70);
  fillBlock("MAT", textLines(D.mat), 70);
  fillBlock("MILIEU", textLines(D.milieu), 70);
  fillBlock("EXIST", textLines(D.exist), 115);
  // Photos
  const ph = [];
  if (D.photos.length) {
    const segs = [];
    D.photos.forEach((p, i) => { const rid = addImage(p.data); if (!rid) return; const [cx, cy] = fit(p.w || 4, p.h || 3, 8.4, 7); if (segs.length) segs.push({ t: "  " }); segs.push({ img: rid, cx, cy }); });
    ph.push(segs);
    const caps = D.photos.map((p, i) => p.caption ? `Image ${i + 1} : ${p.caption}` : "").filter(Boolean);
    if (caps.length) ph.push(caps.join("   ·   "));
  }
  fillBlock("PHOTOS", ph, 115);
  // 5P
  const p5 = [];
  if (D.fait.trim()) p5.push([{ t: "Fait étudié : ", b: true }, { t: D.fait.trim().replace(/\n/g, " ") }]);
  const brs = D.branches.filter(b => b.steps.some(s => s.a.trim()));
  brs.forEach((b, bi) => {
    p5.push("");
    if (brs.length > 1) p5.push([{ t: `Piste ${bi + 1}`, b: true }]);
    const st = b.steps.filter(s => s.a.trim());
    st.forEach((s, si) => p5.push([{ t: `Pourquoi n°${si + 1} ? `, b: true }, { t: "→ " + s.a.trim().replace(/\n/g, " ") + (s.cat ? `  [${KB.cats[s.cat]}]` : "") }]));
    if (b.root && st.length) p5.push([{ t: "Cause racine retenue : ", b: true }, { t: st[st.length - 1].a.trim().replace(/\n/g, " ") }]);
  });
  fillBlock("CINQP", p5, 115);
  // Actions
  const atok = tNodes(doc, "{{T:A_ACT}}")[0];
  if (atok) {
    const tr = up(atok, "tr"); Array.from(tr.childNodes).forEach(c => { if (c.nodeType === 8) tr.removeChild(c); });
    const acts = D.actions.filter(a => (a.action + a.pilote + a.moyens + a.delai).trim());
    const rows = Math.max(4, acts.length);
    for (let i = 0; i < rows; i++) {
      const a = acts[i] || {}; const c = tr.cloneNode(true);
      setTok(c, "{{T:A_ACT}}", a.action || ""); setTok(c, "{{T:A_PIL}}", a.pilote || ""); setTok(c, "{{T:A_MOY}}", a.moyens || ""); setTok(c, "{{T:A_DEL}}", a.delai || "");
      tr.parentNode.insertBefore(c, tr);
    }
    tr.parentNode.removeChild(tr);
  }
  // Signatures
  setTok(doc, "{{T:DATE_AN}}", D.dateAn ? frDate(D.dateAn) : "");
  const fillSig = (scope, key, s) => {
    setTok(scope, `{{T:N_${key}}}`, (s && s.name ? s.name : "") + (s && s.img ? `\nSigné le ${frDateTime(s.at)}` : ""));
    const t = tNodes(scope, `{{S:${key}}}`)[0]; if (!t) return;
    const run = up(t, "r");
    if (s && s.img) { const rid = addImage(s.img); const [cx, cy] = fit(s.w || 300, s.h || 100, 4.6, 1.6); run.parentNode.replaceChild(drawingRun(rid, cx, cy), run); }
    else t.textContent = "";
  };
  ROLES.forEach(([k]) => fillSig(doc, k, D.sig[k]));
  const at = tNodes(doc, "{{S:AUT}}")[0];
  if (at) {
    const tr = up(at, "tr"); const list = D.autres.length ? D.autres : [null];
    list.forEach((s, i) => { const c = tr.cloneNode(true); if (i > 0) { const lab = tNodes(c, "AUTRES")[0]; if (lab) lab.textContent = ""; } fillSig(c, "AUT", s); tr.parentNode.insertBefore(c, tr); });
    tr.parentNode.removeChild(tr);
  }
  const ser = x => { let s = new XMLSerializer().serializeToString(x); if (!s.startsWith("<?xml")) s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + s; return s; };
  zip.file("word/document.xml", ser(doc));
  zip.file("word/_rels/document.xml.rels", ser(rels));
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", compression: "DEFLATE" });
}

/* ============ Démarrage ============ */
(async function init() {
  initPad();
  await DB.open();
  if (!DB.db) toast("Stockage local indisponible : pensez à sauvegarder le dossier (.json).", 5000);
  render();
})();
</script>
